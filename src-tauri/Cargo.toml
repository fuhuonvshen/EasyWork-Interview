# EasyWork - Rust 依赖清单
# 声明项目的所有外部 crate 依赖：
#   - tauri: 桌面应用框架
#   - cpal: WASAPI 音频捕获
#   - whisper-rs: 本地语音转文字
#   - reqwest: 模型文件下载
#   - hound: WAV 文件读写
[package]
name = "easywork"
version = "0.0.1"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Notifications + tray + updater
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

# Audio capture
cpal = "0.17"
anyhow = "1"
ringbuf = "0.4"
hound = "3.5"

# Real-time noise suppression (RNNoise pure-Rust port)
nnnoiseless = { version = "0.5.2", default-features = false }
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
once_cell = "1"

# Whisper transcription
whisper-rs = "0.16"

# SenseVoice transcription (sherpa-onnx)
# 注意：Windows 预编译库必须用 /MD（动态 CRT）与 whisper.cpp 一致（/MT 混链会
# /failifmismatch 且运行时实测错误）。CI 通过 SHERPA_ONNX_ARCHIVE_DIR 喂 v1.13.3 的
# MD 资产（见 build.yml）；升版本前需确认新版本仍有 MD 预编译。
sherpa-onnx = "1.13"

# Model download
reqwest = { version = "0.12", features = ["stream", "json", "system-proxy"] }
futures-util = "0.3"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
zip = "2"
tar = "0.4"
flate2 = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
open = "5"
dirs = "6"
image = "0.25"

# LLM (model download progress tracking)

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Force C/C++ deps to build in release mode even for debug builds,
# to avoid CRT (/MD vs /MDd) mismatch with sherpa-onnx prebuilt libs
[profile.dev.package.whisper-rs-sys]
opt-level = 2

[profile.dev.package.sherpa-onnx-sys]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = "0.3.2"
objc2 = "0.6"
block2 = "0.6"
objc2-avf-audio = { version = "0.3", features = ["block2"] }

