<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OfferSubmit - 简历自动填写</title>
  <script type="module" crossorigin src="/assets/options-CbZIerBq.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/storage-CODHKYEq.js">
  <link rel="stylesheet" crossorigin href="/assets/storage-B7BOSUEO.css">
  <link rel="stylesheet" crossorigin href="/assets/options-D5enGn7r.css">
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <div class="brand-mark">OS</div>
        <div class="brand-text"><b>OfferSubmit</b><span>简历自动填写助手</span></div>
      </div>
      <nav class="rail-nav">
        <button type="button" class="rail-item active" data-page="editor">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15h6M9 11h2"/></svg>
          简历模板
        </button>
        <button type="button" class="rail-item" data-page="records">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          投递记录
        </button>
        <button type="button" class="rail-item" data-page="ai">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.5"/></svg>
          AI 设置
        </button>
      </nav>
      <div class="rail-foot">v0.1.0 · Chrome MV3</div>
    </aside>

    <main class="main">
      <!-- 简历编辑：左目录 + 右整组表单流 -->
      <section class="page active" id="page-editor" data-page-panel="editor">
        <div class="page-head">
          <div class="page-title">
            <h1>简历模板</h1>
            <p>左侧按校招网申模块排布目录，右侧整组表单流式编辑，改动自动保存；一键填充按此内容匹配页面字段。</p>
          </div>
          <div class="toolbar">
            <select id="tpl-select" class="os-select" title="切换模板"></select>
            <input id="tpl-name" class="os-input" spellcheck="false" placeholder="先新建模板" />
            <button type="button" id="btn-tpl-new" class="os-btn">＋ 新建</button>
            <button type="button" id="btn-tpl-full" class="os-btn" title="生成包含全部字段的完整模板，再按需删减">一键完整模板</button>
            <button type="button" id="btn-tpl-del" class="os-btn danger" title="删除当前模板">删除</button>
            <span id="save-chip" class="save-chip" style="visibility:hidden"></span>
          </div>
        </div>
        <div class="editor-body">
          <aside class="dir-panel os-card" id="directory"></aside>
          <div class="flow-panel" id="flow"></div>
        </div>
      </section>

      <!-- 投递记录 -->
      <section class="page" id="page-records" data-page-panel="records"></section>

      <!-- AI 设置 -->
      <section class="page" id="page-ai" data-page-panel="ai"></section>
    </main>
  </div>
</body>
</html>
