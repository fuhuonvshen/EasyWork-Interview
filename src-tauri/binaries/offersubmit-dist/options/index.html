<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OfferSubmit - 简历模板</title>
  <script type="module" crossorigin src="/assets/options-D6b0Y011.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/types-BLqU2D0Z.js">
  <link rel="stylesheet" crossorigin href="/assets/options-Bxjby5xE.css">
</head>
<body>
  <header class="topbar">
    <h1>OfferSubmit <span class="sub">简历自动填写助手</span></h1>
  </header>

  <nav class="tabs">
    <button type="button" data-tab="resume" class="tab active">简历模板</button>
    <button type="button" data-tab="records" class="tab">投递记录</button>
    <button type="button" data-tab="ai" class="tab">AI 设置</button>
  </nav>

  <main>
    <!-- 组件化模板构建器 -->
    <section id="tab-resume" class="panel active">
      <div class="profile-bar">
        <label>模板：
          <select id="tpl-select"></select>
        </label>
        <input id="tpl-name" placeholder="模板名称（可改名）" />
        <button type="button" id="btn-new-tpl" class="btn">+ 新建模板</button>
        <button type="button" id="btn-full-tpl" class="btn" title="一键生成包含全部组件的完整模板，再按需增删">一键完整模板</button>
        <button type="button" id="btn-delete-tpl" class="btn danger">删除模板</button>
      </div>

      <div class="builder">
        <aside class="palette" id="palette">
          <h3>组件库</h3>
          <p class="hint">拖入或点击组件添加到模板，自动按固定顺序排好</p>
          <button type="button" id="btn-add-custom" class="btn small">＋ 自定义组件</button>
          <div id="custom-form" class="custom-form" hidden>
            <input id="custom-label" placeholder="组件名，如：到岗时间" />
            <input id="custom-keywords" placeholder="匹配关键词，逗号分隔，如：到岗时间,arrival" />
            <div class="custom-form-actions">
              <button type="button" id="custom-save" class="btn small primary">保存</button>
              <button type="button" id="custom-cancel" class="btn small">取消</button>
            </div>
          </div>
        </aside>
        <div class="canvas" id="canvas">
          <h3>模板内容</h3>
        </div>
      </div>
    </section>

    <!-- 投递记录 -->
    <section id="tab-records" class="panel">
      <div class="sync-bar">
        <button type="button" id="btn-sync" class="btn primary">从 EasyWork 同步</button>
        <span id="sync-status" class="sync-status"></span>
      </div>
      <table id="records-table">
        <thead>
          <tr><th>公司</th><th>职位</th><th>来源</th><th>投递时间</th><th>状态</th><th>操作</th></tr>
        </thead>
        <tbody id="records-body"></tbody>
      </table>
      <p id="records-empty" class="empty">暂无投递记录</p>
    </section>

    <!-- AI 智能填充设置 -->
    <section id="tab-ai" class="panel">
      <div class="ai-form">
        <p class="hint">
          AI 智能填充会把<b>页面表单结构</b>与<b>简历内容</b>发送到你配置的 API（用于判断每个框该填什么），
          请确认服务可信。填写的 Key 仅保存在本机浏览器扩展中。
        </p>
        <label>API 地址（OpenAI 兼容，Base URL）
          <input id="ai-base-url" placeholder="https://api.deepseek.com/v1" spellcheck="false" />
        </label>
        <label>API Key
          <input id="ai-key" type="password" placeholder="sk-..." spellcheck="false" />
        </label>
        <label>模型
          <input id="ai-model" placeholder="deepseek-chat" spellcheck="false" />
        </label>
        <div class="ai-actions">
          <button type="button" id="ai-save" class="btn primary">保存</button>
          <button type="button" id="ai-test" class="btn">测试连接</button>
          <span id="ai-status" class="sync-status"></span>
        </div>
        <p class="hint" id="ai-saved-hint" hidden>已保存 ✓ 回到招聘页面，用 popup 的「AI 智能填充」按钮试试。</p>
      </div>
    </section>
  </main>

</body>
</html>
