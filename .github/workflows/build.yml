# EasyWork · 云端构建（无需本地 Rust 环境）
# 触发方式：
#   1. push 到 main            → 双端构建安装包并上传为 Actions Artifact（可下载安装）
#   2. 打 tag（如 v0.0.1）      → 双端构建 + 自动创建 GitHub Release（附各平台安装包）
#   3. 手动触发                → 在 Actions 页面点 "Run workflow"
#
# 首次构建较慢（whisper.cpp / sherpa-onnx 等 C/C++ 依赖需现场编译，约 15-40 分钟），
# 之后因 cargo 缓存会快很多。
#
# 平台说明：
#   - Windows: NSIS/MSI 安装包
#   - macOS:   .app + .dmg（未签名：首次打开需右键 → 打开；自动更新需要 Apple 证书签名后才可用）

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            agent_build_cmd: src-tauri\build_agent.bat
            installer_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
            artifact_name: EasyWork-windows-installer
          - os: macos-latest
            agent_build_cmd: bash src-tauri/build_agent.sh
            installer_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
            artifact_name: EasyWork-macos-installer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src-tauri/py_backend/requirements.txt

      - name: Setup Rust (stable + MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build (whisper/sherpa 编译产物)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Python agent dependencies
        run: pip install -r src-tauri/py_backend/requirements.txt pyinstaller

      - name: Build Python agent (PyInstaller)
        run: ${{ matrix.agent_build_cmd }}

      # 注：sherpa-onnx 不干预，构建方式与 EasyWork 的 publish.yml 完全一致，
      # sherpa-onnx-sys 构建脚本自动下载匹配的预编译库。

      # ── 普通 push：构建 + 上传 Artifact（不发布 Release）──
      - name: Build Tauri app (non-tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri:build

      - name: Upload installer artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.installer_paths }}
          retention-days: 30

      # ── 打 tag：构建 + 签名 + 发布 Release（与 EasyWork publish.yml 同款）──
      # 注意：不要用 tauri-action 创建 tag/release —— tag 已由 git push 创建，
      # tauri-action 会因"tag 已存在"报错。这里改为构建后直接上传资产。
      # 若在仓库 Secrets 配置了 TAURI_SIGNING_PRIVATE_KEY（tauri signer generate 生成），
      # 安装包将带签名，应用内自动更新（updater）可用；未配置则仅发布安装包。
      # macOS 的自动更新还需 Apple Developer 证书签名（APPLE_* secrets），否则请手动安装。
      - name: Build Tauri app (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run tauri:build

      # 注：if 条件里不能引用 secrets（workflow 解析会报错），改为运行时判断
      - name: Sign installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TSK: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TSPW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TSK" ]; then
            echo "未配置 TAURI_SIGNING_PRIVATE_KEY，跳过签名（应用内更新不可用，安装包可正常使用）"
            exit 0
          fi
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            installer=$(ls src-tauri/target/release/bundle/msi/*.msi | head -1)
          else
            installer=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          fi
          # Strip PEM headers, keep raw base64
          raw_key=$(grep -v '^-----' <<< "$TSK" | tr -d '\n')
          # tauri signer 自动生成 <installer>.sig；其 stdout 是提示消息而非签名，
          # 不能 echo 回写 .sig（会污染签名导致应用内更新校验失败）
          npx tauri signer sign \
            --private-key "$raw_key" \
            --password "$TSPW" \
            "$installer"

      - name: Upload Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/*/*

  update-json:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir /tmp/release-assets

      - name: Generate update.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME" VERSION="${TAG#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Build JSON with jq (pre-installed on ubuntu)
          jq -n \
            --arg v "$VERSION" \
            --arg d "$DATE" \
            --arg win_installer "$(basename /tmp/release-assets/*.msi 2>/dev/null || echo '')" \
            --arg win_sig "$(cat /tmp/release-assets/*.msi.sig 2>/dev/null || echo '')" \
            --arg mac_installer "$(basename /tmp/release-assets/*.dmg 2>/dev/null || echo '')" \
            --arg mac_sig "$(cat /tmp/release-assets/*.dmg.sig 2>/dev/null || echo '')" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg tag "$TAG" \
            '{
              version: $v,
              notes: "",
              pub_date: $d,
              platforms: {
                "windows-x86_64": {
                  url: "https://github.com/\($repo)/releases/download/\($tag)/\($win_installer)",
                  signature: $win_sig
                }
              }
            }
            | if $mac_installer != "" and $mac_sig != "" then
              .platforms["darwin-aarch64"] = {
                url: "https://github.com/\($repo)/releases/download/\($tag)/\($mac_installer)",
                signature: $mac_sig
              }
            else . end' > update.json

      - name: Upload update.json to Release
        uses: softprops/action-gh-release@v2
        with:
          files: update.json
