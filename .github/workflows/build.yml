# EasyWork · 云端构建（无需本地 Rust 环境）
# 触发方式：
#   1. push 到 main            → 双端构建安装包并上传为 Actions Artifact（可下载安装）
#   2. 打 tag（如 v0.0.1）      → 双端构建 + 自动创建 GitHub Release（附各平台安装包）
#   3. 手动触发                → 在 Actions 页面点 "Run workflow"
#
# 首次构建较慢（whisper.cpp / sherpa-onnx 等 C/C++ 依赖需现场编译，约 15-40 分钟），
# 之后因 cargo 缓存会快很多。
#
# 平台说明：
#   - Windows: NSIS/MSI 安装包
#   - macOS:   .app + .dmg（未签名：首次打开需右键 → 打开；自动更新需要 Apple 证书签名后才可用）

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            agent_build_cmd: src-tauri\build_agent.bat
            agent_build_shell: cmd
            installer_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
            artifact_name: EasyWork-windows-installer
          - os: macos-latest
            agent_build_cmd: bash src-tauri/build_agent.sh
            agent_build_shell: bash
            installer_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
            artifact_name: EasyWork-macos-installer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src-tauri/py_backend/requirements.txt

      - name: Setup Rust (stable + MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build (whisper/sherpa 编译产物)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Python agent dependencies
        run: pip install -r src-tauri/py_backend/requirements.txt pyinstaller

      - name: Build Python agent (PyInstaller)
        shell: ${{ matrix.agent_build_shell }}
        run: ${{ matrix.agent_build_cmd }}

      # ── 普通 push：构建 + 上传 Artifact（不发布 Release）──
      - name: Build Tauri app (non-tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run tauri:build

      - name: Upload installer artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.installer_paths }}
          retention-days: 30

      # ── 打 tag：构建 + 自动发布 Release（各平台安装包 + update.json）──
      # 若在仓库 Secrets 配置了 TAURI_SIGNING_PRIVATE_KEY（tauri signer generate 生成），
      # 安装包将带签名，应用内自动更新（updater）可用；未配置则仅发布安装包。
      # macOS 的自动更新还需 Apple Developer 证书签名（APPLE_* secrets），否则请手动安装。
      - name: Build & Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "EasyWork v__VERSION__"
          releaseBody: "自动构建：请下载对应平台的安装包安装。"
          releaseDraft: true
          prerelease: false
